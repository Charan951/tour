plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}



def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing: create android/key.properties (git-ignored) from
// key.properties.example and point it at your upload keystore. If it's
// absent (local dev / CI without secrets) the build falls back to the
// debug key so `flutter run --release` still works.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.holidaycity.mobile"
    compileSdk 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.holidaycity.mobile"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? rootProject.file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug

            // Code/resource shrinking. proguard-rules.pro already carries the
            // Razorpay + Flutter keeps. Kept OFF by default because a shrunk
            // release build must be smoke-tested (payments, push, image
            // picker) before shipping — flip to true once verified.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

flutter {
    source '../..'
}

tasks.register("copyFrontendLogos") {
    doLast {
        def clientPublic = file("../../../client/public")
        def mobileAssets = file("../../assets/images")
        if (!mobileAssets.exists()) {
            mobileAssets.mkdirs()
        }
        def logoSrc = new File(clientPublic, "logo.png")
        def faviconSrc = new File(clientPublic, "favicon.png")
        if (logoSrc.exists()) {
            copy {
                from logoSrc
                into mobileAssets
            }
        }
        if (faviconSrc.exists()) {
            copy {
                from faviconSrc
                into mobileAssets
                rename "favicon.png", "logo_icon.png"
            }
        }
    }
}
project.afterEvaluate {
    if (tasks.findByName('preBuild')) {
        tasks.preBuild.dependsOn copyFrontendLogos
    }
}

