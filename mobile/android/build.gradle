// Ensure plugin resolution repositories are available for Gradle plugin resolution
buildscript {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        // Flutter plugins repository
        maven {
            url 'https://storage.googleapis.com/download.flutter.io'
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://storage.googleapis.com/download.flutter.io'
        }
        // Gradle Plugin Portal as a fallback for some plugins
        maven {
            url 'https://plugins.gradle.org/m2/'
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
