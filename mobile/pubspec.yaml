name: holidaycity_mobile
description: "HolidayCity Official Travel & Tour Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  google_fonts: ^8.2.1
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.0
  intl: ^0.20.3
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  socket_io_client: ^3.1.6
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  razorpay_flutter: ^1.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
